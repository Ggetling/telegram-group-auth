name: checks

# No secrets and no network beyond installing dependencies, so this run is
# reproducible in any fork, and a pull request from one is safe to run.
on:
  # main and pull requests only: a push to a PR branch would otherwise run the
  # matrix twice for the same commit.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Types
        run: mypy

      - name: The core must not need a bot framework
        # The claim in the README is that group_auth imports with nothing
        # installed. Left untested, it would quietly stop being true the first
        # time somebody adds a convenience import at the top of a core module.
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/pip install --quiet .
          /tmp/bare/bin/python -c "
          import group_auth
          from group_auth import MembershipChecker, AuthConfig, SqliteStore
          import importlib.util
          assert importlib.util.find_spec('aiogram') is None, 'aiogram leaked in'
          print('core imports clean:', group_auth.__version__)
          "
